---
# Sequence of update tasks for Debian and derivate OSes

- name: Disable unattended upgrades (Ansible manages updates)
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
    mode: "0644"
  when: ansible_facts['distribution'] == "Ubuntu"

- name: Update apt cache, repairing known problems if it fails
  become: true
  block:
    - name: Ensure Apt Cache is up-to-date
      ansible.builtin.apt:
        update_cache: true

  rescue:
    - name: Capture the real apt error (the apt module only reports "unknown reason")  # noqa: command-instead-of-module
      ansible.builtin.command: apt-get update
      register: linux_updates_apt_raw
      changed_when: false
      failed_when: false

    - name: Get package states
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - -f=${db:Status-Abbrev}|${binary:Package}\n
      register: linux_updates_dpkg_states
      changed_when: false

    - name: Select the repairs that match this failure
      ansible.builtin.set_fact:
        linux_updates_matched_repairs: "{{ linux_updates_matched_repairs | default([]) + [item.name] }}"
      loop: "{{ linux_updates_apt_repairs }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        (item.stderr is defined and linux_updates_apt_raw.stderr is search(item.stderr))
        or (item.dpkg_state is defined and
            (linux_updates_dpkg_states.stdout_lines | select('match', item.dpkg_state) | list | length > 0))

    - name: No known repair for this error (default case)
      ansible.builtin.fail:
        msg: "apt update failed and no repair matched. apt-get output:\n{{ linux_updates_apt_raw.stderr }}"
      when: linux_updates_matched_repairs | default([]) | length == 0

    - name: Run matching repairs
      ansible.builtin.include_tasks: "apt-repairs/{{ item }}.yml"
      loop: "{{ linux_updates_matched_repairs }}"

    - name: Retry apt cache update after repair
      ansible.builtin.apt:
        update_cache: true

    - name: Report repairs performed
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: apt cache update repaired by {{ linux_updates_matched_repairs | join(', ') }}"

- name: Ensure all packages are updated to the latest version using full-upgrade # noqa: package-latest
  ansible.builtin.apt:
    upgrade: 'full'
  register: updates
  notify: Check reboot debian
  become: true

- name: Ensure Autoremove runs when suggested by apt upgrade
  ansible.builtin.apt:
    autoremove: true
  when: '"Use ''sudo apt autoremove'' to remove " in updates.stdout'
  become: true
